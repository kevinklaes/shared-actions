# Fixture: a caller repo whose only workflow calls the shared reusable
# workflows and uses no actions directly. Audited by ci.yml, never run.
name: Lint actions

on:
  pull_request:

permissions: {}

jobs:
  zizmor:
    uses: kevinklaes/shared-actions/.github/workflows/action-security-check.yml@v1.0.0
    permissions:
      contents: read

  actions-lock:
    uses: kevinklaes/shared-actions/.github/workflows/actions-lock-check.yml@v1.0.0
    permissions:
      contents: read
